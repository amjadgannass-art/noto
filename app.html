<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noto</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 270px;
    background: white;
    border-right: 1px solid #e5e7eb;
    padding: 25px 15px;
    overflow-y: auto;
}

.logo {
    font-size: 26px;
    font-weight: 700;
    padding: 0 10px;
    margin-bottom: 35px;
}

.section-title {
    font-size: 12px;
    font-weight: 700;
    color: #9ca3af;
    text-transform: uppercase;
    padding: 0 10px;
    margin-bottom: 10px;
}

.tree {
    font-size: 15px;
}

.tree-item {
    margin: 2px 0;
}

.item-row {
    display: flex;
    align-items: center;
    gap: 5px;
    min-height: 40px;
    border-radius: 9px;
}

.item-row:hover {
    background: #f3f4f6;
}

.arrow {
    width: 25px;
    height: 30px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: #6b7280;
    font-size: 13px;
}

.item-name {
    flex: 1;
    padding: 8px 5px;
    cursor: pointer;
}

.menu {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: #9ca3af;
    font-size: 17px;
}

.children {
    margin-left: 22px;
    border-left: 1px solid #e5e7eb;
    padding-left: 7px;
}

.add-root {
    width: 100%;
    margin-top: 15px;
    padding: 11px;
    border: 1px dashed #d1d5db;
    border-radius: 10px;
    background: transparent;
    color: #6b7280;
    cursor: pointer;
}

.add-root:hover {
    background: #f9fafb;
}

/* MAIN */

.main {
    margin-left: 270px;
    min-height: 100vh;
}

header {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 30px;
}

.header-title {
    font-weight: 600;
}

.logout {
    margin-left: auto;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: #1f2937;
    color: white;
    cursor: pointer;
}

/* DASHBOARD */

.dashboard-content {
    max-width: 1100px;
    padding: 50px 35px;
}

h1 {
    font-size: 36px;
    margin: 0 0 8px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 40px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    border: 1px solid #e5e7eb;
}

.card h2 {
    margin-top: 0;
    font-size: 20px;
}

.number {
    font-size: 36px;
    font-weight: 700;
    margin: 15px 0;
}

/* WRITING PAGE */

.writing-page {
    display: none;
    min-height: calc(100vh - 70px);
    background: #fff;
}

.writing-header {
    height: 65px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 25px;
    gap: 15px;
}

.back-button {
    border: none;
    background: #f3f4f6;
    padding: 9px 15px;
    border-radius: 9px;
    cursor: pointer;
}

.page-name {
    font-weight: 600;
}

.writing-area {
    width: min(900px, calc(100% - 50px));
    margin: 45px auto;
}

.editor {
    min-height: 65vh;
    outline: none;
    font-size: 18px;
    line-height: 1.8;
    white-space: pre-wrap;
}

.editor:empty:before {
    content: "Start writing...";
    color: #c4c7cc;
}

.references {
    margin-top: 50px;
    padding-top: 18px;
    border-top: 1px solid #d1d5db;
    color: #6b7280;
    font-size: 14px;
}

/* CONTEXT MENU */

.context-menu {
    display: none;
    position: fixed;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    padding: 6px;
    z-index: 1000;
    width: 160px;
}

.context-menu button {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 9px 10px;
    border-radius: 7px;
    cursor: pointer;
}

.context-menu button:hover {
    background: #f3f4f6;
}

/* MOBILE */

@media (max-width: 700px) {
    .sidebar {
        width: 220px;
    }

    .main {
        margin-left: 220px;
    }

    .writing-area {
        width: calc(100% - 30px);
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">Noto</div>

    <div class="section-title">Subjects</div>

    <div id="tree" class="tree"></div>

    <button class="add-root" onclick="addRootItem()">
        + Add subject
    </button>

</aside>


<!-- MAIN -->

<div class="main">

    <header>
        <div class="header-title" id="headerTitle">
            Study Dashboard
        </div>

        <button class="logout" onclick="logout()">
            Log Out
        </button>
    </header>


    <!-- DASHBOARD -->

    <section id="dashboardPage" class="dashboard-content">

        <h1>Study Dashboard</h1>

        <p class="subtitle">
            Your space to organise, write and track your learning.
        </p>

        <div class="dashboard">

            <div class="card">
                <h2>Documents</h2>
                <div class="number" id="documentCount">0</div>
                <p>Documents completed</p>
            </div>

            <div class="card">
                <h2>Subjects</h2>
                <div class="number" id="subjectCount">0</div>
                <p>Subjects created</p>
            </div>

            <div class="card">
                <h2>Overall Progress</h2>
                <div class="number">0%</div>
                <p>Your current progress</p>
            </div>

        </div>

    </section>


    <!-- WRITING PAGE -->

    <section id="writingPage" class="writing-page">

        <div class="writing-header">

            <button class="back-button" onclick="showDashboard()">
                ← Dashboard
            </button>

            <div class="page-name" id="pageName"></div>

        </div>

        <div class="writing-area">

            <div
                id="editor"
                class="editor"
                contenteditable="true"
            ></div>

            <div class="references">
                References
            </div>

        </div>

    </section>

</div>


<!-- CONTEXT MENU -->

<div id="contextMenu" class="context-menu">

    <button onclick="addChild()">+ Add sub-item</button>

    <button onclick="renameItem()">Rename</button>

    <button onclick="deleteItem()">Delete</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://bauqaxntmhpiuqdnkrun.supabase.co";

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhdXFheG50bWhwaXVxZG5rcnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTM4MTUsImV4cCI6MjEwNTU2OTgxNX0.0p5V6-p4MddUc2j7WGbCyfOnEGNIJMK3uTQzETZAeiA";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* SAMPLE NAVIGATION */

let treeData = [
    {
        id: 1,
        name: "Symptom-based",
        children: [],
        expanded: true
    }
];


let nextId = 2;

let selectedItem = null;


/* RENDER TREE */

function renderTree() {

    const tree = document.getElementById("tree");

    tree.innerHTML = "";

    treeData.forEach(function(item) {

        tree.appendChild(createTreeItem(item));

    });

    document.getElementById("subjectCount").textContent =
        treeData.length;
}


/* CREATE TREE ITEM */

function createTreeItem(item) {

    const wrapper = document.createElement("div");

    wrapper.className = "tree-item";


    const row = document.createElement("div");

    row.className = "item-row";


    const arrow = document.createElement("button");

    arrow.className = "arrow";

    if (item.children && item.children.length > 0) {

        arrow.textContent = item.expanded ? "▼" : "▶";

        arrow.onclick = function(event) {

            event.stopPropagation();

            item.expanded = !item.expanded;

            renderTree();

        };

    } else {

        arrow.textContent = "";

    }


    const name = document.createElement("div");

    name.className = "item-name";

    name.textContent = item.name;


    name.onclick = function() {

        openWritingPage(item);

    };


    name.oncontextmenu = function(event) {

        event.preventDefault();

        event.stopPropagation();

        selectedItem = item;

        showContextMenu(event.clientX, event.clientY);

    };


    const menu = document.createElement("button");

    menu.className = "menu";

    menu.textContent = "⋯";

    menu.onclick = function(event) {

        event.stopPropagation();

        selectedItem = item;

        showContextMenu(
            event.clientX,
            event.clientY
        );

    };


    row.appendChild(arrow);

    row.appendChild(name);

    row.appendChild(menu);

    wrapper.appendChild(row);


    if (
        item.children &&
        item.children.length > 0 &&
        item.expanded
    ) {

        const children = document.createElement("div");

        children.className = "children";

        item.children.forEach(function(child) {

            children.appendChild(
                createTreeItem(child)
            );

        });

        wrapper.appendChild(children);

    }


    return wrapper;
}


/* ADD SUBJECT */

function addRootItem() {

    const name = prompt("Enter subject name:");

    if (!name || !name.trim()) {
        return;
    }

    treeData.push({
        id: nextId++,
        name: name.trim(),
        children: [],
        expanded: true
    });

    renderTree();
}


/* ADD SUB-ITEM */

function addChild() {

    if (!selectedItem) {
        return;
    }

    hideContextMenu();

    const name = prompt(
        "Enter name for the new item:"
    );

    if (!name || !name.trim()) {
        return;
    }

    if (!selectedItem.children) {
        selectedItem.children = [];
    }

    selectedItem.children.push({
        id: nextId++,
        name: name.trim(),
        children: [],
        expanded: true
    });

    selectedItem.expanded = true;

    renderTree();
}


/* FIND ITEM */

function findParent(list, target) {

    for (const item of list) {

        if (item === target) {
            return list;
        }

        if (item.children) {

            const result =
                findParent(item.children, target);

            if (result) {
                return result;
            }

        }

    }

    return null;
}


/* RENAME */

function renameItem() {

    if (!selectedItem) {
        return;
    }

    hideContextMenu();

    const name = prompt(
        "Rename:",
        selectedItem.name
    );

    if (!name || !name.trim()) {
        return;
    }

    selectedItem.name = name.trim();

    renderTree();
}


/* DELETE */

function deleteItem() {

    if (!selectedItem) {
        return;
    }

    hideContextMenu();

    const confirmed = confirm(
        "Delete " + selectedItem.name + "?"
    );

    if (!confirmed) {
        return;
    }

    const parentList =
        findParent(treeData, selectedItem);

    if (parentList) {

        const index =
            parentList.indexOf(selectedItem);

        if (index !== -1) {
            parentList.splice(index, 1);
        }

    }

    renderTree();
}


/* CONTEXT MENU */

function showContextMenu(x, y) {

    const menu =
        document.getElementById("contextMenu");

    menu.style.display = "block";

    menu.style.left = x + "px";

    menu.style.top = y + "px";
}


function hideContextMenu() {

    document.getElementById(
        "contextMenu"
    ).style.display = "none";

}


document.addEventListener(
    "click",
    function() {
        hideContextMenu();
    }
);


/* OPEN WRITING PAGE */

function openWritingPage(item) {

    document.getElementById(
        "dashboardPage"
    ).style.display = "none";

    document.getElementById(
        "writingPage"
    ).style.display = "block";

    document.getElementById(
        "pageName"
    ).textContent = item.name;

    document.getElementById(
        "headerTitle"
    ).textContent = item.name;

    const editor =
        document.getElementById("editor");

    editor.innerHTML = "";

    editor.focus();

}


/* DASHBOARD */

function showDashboard() {

    document.getElementById(
        "writingPage"
    ).style.display = "none";

    document.getElementById(
        "dashboardPage"
    ).style.display = "block";

    document.getElementById(
        "headerTitle"
    ).textContent = "Study Dashboard";

}


/* LOGOUT */

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "index.html";

}


/* START */

renderTree();

</script>

</body>
</html>
