<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noto</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

header {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 25px;
}

.logo {
    font-size: 25px;
    font-weight: 700;
}

.logout {
    margin-left: auto;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: #1f2937;
    color: white;
    cursor: pointer;
}

main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 50px 25px;
}

h1 {
    font-size: 36px;
    margin-bottom: 8px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 40px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    border: 1px solid #e5e7eb;
}

.card h2 {
    margin-top: 0;
    font-size: 20px;
}

.number {
    font-size: 36px;
    font-weight: 700;
    margin: 15px 0;
}
</style>
</head>

<body>

<header>
    <div class="logo">Noto</div>
    <button class="logout" onclick="logout()">Log Out</button>
</header>

<main>

    <h1>Study Dashboard</h1>

    <p class="subtitle">
        Your space to organise, write and track your learning.
    </p>

    <div class="dashboard">

        <div class="card">
            <h2>Documents</h2>
            <div class="number">0</div>
            <p>Documents completed</p>
        </div>

        <div class="card">
            <h2>Subjects</h2>
            <div class="number">0</div>
            <p>Subjects created</p>
        </div>

        <div class="card">
            <h2>Overall Progress</h2>
            <div class="number">0%</div>
            <p>Your current progress</p>
        </div>

    </div>

</main>

</html>
