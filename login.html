<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Noto</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #f7f3ff, #e9f5ff, #fff7e8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #252336;
}

.box {
  width: min(420px, 90%);
  background: white;
  padding: 40px;
  border-radius: 24px;
  box-shadow: 0 15px 45px rgba(50, 40, 100, 0.12);
}

h1 {
  text-align: center;
  margin: 0 0 8px;
}

.subtitle {
  text-align: center;
  color: #686579;
  margin-bottom: 30px;
}

label {
  display: block;
  margin: 16px 0 7px;
  font-weight: 600;
}

input {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd9e8;
  border-radius: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #252336;
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #686579;
  text-decoration: none;
}

#message {
  text-align: center;
  margin-top: 18px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="box">
  <h1>Welcome back</h1>
  <p class="subtitle">Log in to your Noto space.</p>

  <label for="email">Email</label>
  <input id="email" type="email" placeholder="Your email">

  <label for="password">Password</label>
  <input id="password" type="password" placeholder="Your password">

  <button id="loginButton">Log In</button>

  <p id="message"></p>

  <a class="back" href="index.html">Back to Noto</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://bauqaxntmhpiuqdnkrun.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhdXFheG50bWhwaXVxZG5rcnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTM4MTUsImV4cCI6MjEwNTU2OTgxNX0.0p5V6-p4MddUc2j7WGbCyfOnEGNIJMK3uTQzETZAeiA";

const { createClient } = supabase;

const supabaseClient = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const button = document.getElementById("loginButton");
const message = document.getElementById("message");

button.addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message.textContent = "";

  if (!email || !password) {
    message.textContent = "Please enter your email and password.";
    return;
  }

  button.disabled = true;
  button.textContent = "Logging in...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = error.message;
    button.disabled = false;
    button.textContent = "Log In";
    return;
  }

  window.location.href = "app.html";
});
</script>

</body>
</html>
