<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Noto</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #f7f3ff, #e9f5ff, #fff7e8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #252336;
}

.box {
  width: min(420px, 90%);
  background: white;
  padding: 40px;
  border-radius: 24px;
  box-shadow: 0 15px 45px rgba(50, 40, 100, 0.12);
}

h1 {
  text-align: center;
  margin: 0 0 8px;
}

.subtitle {
  text-align: center;
  color: #686579;
  margin-bottom: 30px;
}

label {
  display: block;
  margin: 16px 0 7px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd9e8;
  border-radius: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #252336;
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #686579;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="box">
  <h1>Welcome back</h1>
  <p class="subtitle">Log in to your Noto space.</p>

  <label>Email</label>
  <input type="email" placeholder="Your email">

  <label>Password</label>
  <input type="password" placeholder="Your password">

  <button>Log In</button>

  <a class="back" href="index.html">Back to Noto</a>
</div>

</body>
</html>
