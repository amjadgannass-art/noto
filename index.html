<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noto</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #f7f3ff, #e9f5ff, #fff7e8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #252336;
}

.container {
  text-align: center;
  padding: 40px 20px;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}

.symbol {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  background: white;
  box-shadow: 0 8px 25px rgba(50, 40, 100, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

h1 {
  margin: 0;
  font-size: 52px;
  letter-spacing: -2px;
}

p {
  font-size: 18px;
  color: #686579;
  margin: 0 auto 35px;
  max-width: 500px;
  line-height: 1.6;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 14px;
}

button, .signup {
  border: none;
  padding: 14px 28px;
  border-radius: 14px;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
}

.login {
  background: white;
  color: #252336;
  box-shadow: 0 8px 25px rgba(50, 40, 100, 0.10);
}

.signup {
  background: #252336;
  color: white;
  box-shadow: 0 8px 25px rgba(50, 40, 100, 0.18);
  text-decoration: none;
  display: inline-block;
}

button:hover {
  transform: translateY(-2px);
}

@media (max-width: 500px) {
  h1 {
    font-size: 42px;
  }

  .buttons {
    flex-direction: column;
  }

  button {
    width: 220px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
   <div class="symbol">✦</div>
    <h1>Noto</h1>
  </div>

  <p>
    Your personal space to write, organise and learn.
  </p>

  <div class="buttons">
    <button class="login">Log In</button>
    <a href="signup.html" class="signup">Sign Up</a>
  </div>

</div>

</body>
</html>
